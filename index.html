<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>ぷくぷく！たにくらいふ エンドレス♾️</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#efe0bd"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ぷくぷく∞">
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":52547480,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const ENDLESS_WEB_SAVE_KEYS = [
	'/userfs/godot/app_userdata/ぷくぷく！たにくらいふ エンドレス♾️/puku_puku_taniku_endless_v3.json',
	'/userfs/godot/app_userdata/ぷくぷく！たにくらいふ エンドレス♾️/puku_puku_taniku_endless_v2.json',
	'/userfs/godot/app_userdata/ぷくぷく！たにくらいふ エンドレス♾️/puku_puku_taniku_endless_v1.json',
];
const engine = new Engine(GODOT_CONFIG);

function openExistingUserDatabase() {
	return new Promise((resolve, reject) => {
		let createdDatabase = false;
		const request = indexedDB.open('/userfs');
		request.onupgradeneeded = (event) => {
			if (event.oldVersion === 0) {
				createdDatabase = true;
				request.transaction.abort();
			}
		};
		request.onsuccess = () => resolve(request.result);
		request.onerror = () => {
			if (createdDatabase && request.error && request.error.name === 'AbortError') {
				resolve(null);
				return;
			}
			reject(request.error || new Error('Could not open the Web save database.'));
		};
	});
}

async function resetEndlessWebSaveIfRequested() {
	const url = new URL(window.location.href);
	if (url.searchParams.get('reset') !== '1') {
		return;
	}
	const database = await openExistingUserDatabase();
	if (database !== null) {
		try {
			if (database.objectStoreNames.contains('FILE_DATA')) {
				await new Promise((resolve, reject) => {
					const transaction = database.transaction('FILE_DATA', 'readwrite');
					const store = transaction.objectStore('FILE_DATA');
					const records = new Array(ENDLESS_WEB_SAVE_KEYS.length);
					let readsRemaining = ENDLESS_WEB_SAVE_KEYS.length;
					for (let index = 0; index < ENDLESS_WEB_SAVE_KEYS.length; index += 1) {
						const request = store.get(ENDLESS_WEB_SAVE_KEYS[index]);
						request.onsuccess = () => {
							records[index] = request.result || null;
							readsRemaining -= 1;
							if (readsRemaining !== 0) {
								return;
							}
							const template = records.find((record) => record !== null);
							if (template !== undefined) {
								const emptySave = {
									save_version: 3,
									best_size_cm: 0,
									harvest_count: 0,
									cumulative_harvest_cm: 0,
									other_species_unlocked: false,
									speed_2x_purchased: false,
									speed_5x_purchased: false,
									selected_growth_multiplier: 1,
									jelly_count: 0,
									last_updated_at: Date.now() / 1000,
									plants: [],
									seeds_remaining: 12,
									concurrent_target: 0,
									batch_index: 0,
								};
								const freshRecord = {
									...template,
									contents: new TextEncoder().encode(JSON.stringify(emptySave)),
								};
								if (store.keyPath === null) {
									store.put(freshRecord, ENDLESS_WEB_SAVE_KEYS[0]);
								} else {
									freshRecord[store.keyPath] = ENDLESS_WEB_SAVE_KEYS[0];
									store.put(freshRecord);
								}
							}
							store.delete(ENDLESS_WEB_SAVE_KEYS[1]);
							store.delete(ENDLESS_WEB_SAVE_KEYS[2]);
						};
						request.onerror = () => transaction.abort();
					}
					transaction.oncomplete = () => resolve();
					transaction.onerror = () => reject(transaction.error);
					transaction.onabort = () => reject(transaction.error || new Error('Web save reset was aborted.'));
				});
			}
		} finally {
			database.close();
		}
	}
	url.searchParams.delete('reset');
	window.history.replaceState(null, '', url.pathname + url.search + url.hash);
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG.serviceWorker && GODOT_CONFIG.ensureCrossOriginIsolationHeaders && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration !== null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(resolve, 2000)),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		resetEndlessWebSaveIfRequested().then(() => engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
